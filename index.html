<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adele Roseville — Now Selling</title>

  <!-- grid only, everything else is in style.css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- hero -->
  <header class="hero">
    <div class="container">
      <p class="hero-eyebrow">21–27 Roseville Avenue, Roseville</p>
      <h1>Where exceptional homes<br>meet an extraordinary lifestyle</h1>
      <a href="#units" class="btn btn-brand">View available units</a>
    </div>
  </header>

  <!-- filter -->
  <section class="toolbar">
    <div class="container d-flex flex-wrap gap-2 align-items-center">
      <span class="toolbar-label">Bedrooms</span>
      <button class="chip is-active" data-beds="all">All</button>
      <button class="chip" data-beds="1">1</button>
      <button class="chip" data-beds="2">2</button>
      <button class="chip" data-beds="3">3</button>
      <span class="toolbar-count ms-auto" id="count"></span>
    </div>
  </section>

  <!-- unit grid -->
  <main class="container py-4" id="units">
    <div class="row g-3 g-md-4" id="unit-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Sales office · Monday to Friday 9am – 5pm · Saturday &amp; Sunday 10am – 5pm</p>
      <p class="muted">Demo page built as a work sample. Not affiliated with any developer.</p>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
